name: embcsv smoke

on:
  push:
    branches:
      - chatgpt-smoke-test
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with strict warnings
        run: |
          mkdir -p build
          gcc -std=c11 \
            -Wall -Wextra -Wpedantic \
            -Wshadow -Wformat=2 -Wcast-align \
            -Wconversion -Wsign-conversion \
            -Werror \
            -Iinclude \
            src/embcsv.c tests/smoke.c \
            -o build/embcsv-smoke

      - name: Run smoke tests
        run: ./build/embcsv-smoke
