name: nanoprintf footprint

on:
  push:
    branches:
      - chatgpt-smoke-test
  workflow_dispatch:

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch nanoprintf
        run: |
          git clone --depth 1 https://github.com/charlesnicholson/nanoprintf.git /tmp/nanoprintf

      - name: Build footprint probes
        run: |
          cat > /tmp/npf_impl.c <<'EOF'
          #define NANOPRINTF_IMPLEMENTATION
          #define NANOPRINTF_VISIBILITY_STATIC

          #define NANOPRINTF_USE_FIELD_WIDTH_FORMAT_SPECIFIERS 0
          #define NANOPRINTF_USE_PRECISION_FORMAT_SPECIFIERS 1
          #define NANOPRINTF_USE_FLOAT_FORMAT_SPECIFIERS 1
          #define NANOPRINTF_USE_FLOAT_HEX_FORMAT_SPECIFIER 0
          #define NANOPRINTF_USE_FLOAT_SCI_FORMAT_SPECIFIER 1
          #define NANOPRINTF_USE_FLOAT_SHORTEST_FORMAT_SPECIFIER 0
          #define NANOPRINTF_USE_SMALL_FORMAT_SPECIFIERS 0
          #define NANOPRINTF_USE_LARGE_FORMAT_SPECIFIERS 0
          #define NANOPRINTF_USE_FIXED_WIDTH_FORMAT_SPECIFIERS 0
          #define NANOPRINTF_USE_BINARY_FORMAT_SPECIFIERS 0
          #define NANOPRINTF_USE_WRITEBACK_FORMAT_SPECIFIERS 0
          #define NANOPRINTF_USE_ALT_FORM_FLAG 0
          #define NANOPRINTF_USE_FLOAT_SINGLE_PRECISION 0
          #define NANOPRINTF_USE_DIVISION_FREE_CONVERSION 0

          #include "/tmp/nanoprintf/nanoprintf.h"

          int embcsv_npf_format_f(char *buf, size_t n, int precision, double value)
          {
              return npf_snprintf(buf, n, "%.*f", precision, value);
          }

          int embcsv_npf_format_e(char *buf, size_t n, int precision, double value)
          {
              return npf_snprintf(buf, n, "%.*e", precision, value);
          }
          EOF

          cat > /tmp/npf_probe.c <<'EOF'
          #include <stddef.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>
          #include <math.h>

          int embcsv_npf_format_f(char *buf, size_t n, int precision, double value);
          int embcsv_npf_format_e(char *buf, size_t n, int precision, double value);

          volatile double input_value = 1.23456789;
          volatile int input_precision = 6;
          volatile int sink_value;

          static int check(const char *actual, const char *expected)
          {
              if (strcmp(actual, expected) != 0) {
                  fprintf(stderr, "expected=[%s] actual=[%s]\n", expected, actual);
                  return 0;
              }
              return 1;
          }

          int main(void)
          {
              char buf[128];
              int n = 0;

              n += embcsv_npf_format_f(buf, sizeof(buf), input_precision, input_value);
              n += embcsv_npf_format_e(buf, sizeof(buf), input_precision, input_value);

              if (embcsv_npf_format_f(buf, sizeof(buf), 2, 1.25) < 0) return 10;
              if (!check(buf, "1.25")) return 11;

              if (embcsv_npf_format_e(buf, sizeof(buf), 3, 12345678.0) < 0) return 12;
              if (!check(buf, "1.235e+07")) return 13;

              if (embcsv_npf_format_f(buf, sizeof(buf), 2, NAN) < 0) return 14;
              if (!check(buf, "nan")) return 15;

              if (embcsv_npf_format_f(buf, sizeof(buf), 2, INFINITY) < 0) return 16;
              if (!check(buf, "inf")) return 17;

              if (embcsv_npf_format_f(buf, sizeof(buf), 2, -INFINITY) < 0) return 18;
              if (!check(buf, "-inf")) return 19;

              /*
               * Deliberately probe 17 digits. This is not a proof of correctness;
               * it only exposes whether the formatter can emit the requested width.
               */
              if (embcsv_npf_format_e(buf, sizeof(buf), 17, 1.2345678901234567) < 0) return 20;
              printf("f64-17=%s\n", buf);

              sink_value = n;
              return 0;
          }
          EOF

          cat > /tmp/baseline.c <<'EOF'
          volatile int sink_value;
          int main(void)
          {
              sink_value = 1;
              return 0;
          }
          EOF

          gcc -std=c11 -Os -ffunction-sections -fdata-sections \
            -c /tmp/npf_impl.c -o /tmp/npf_impl.o

          gcc -std=c11 -Os -ffunction-sections -fdata-sections \
            /tmp/baseline.c -Wl,--gc-sections -o /tmp/baseline

          gcc -std=c11 -Os -ffunction-sections -fdata-sections \
            /tmp/npf_impl.c /tmp/npf_probe.c \
            -Wl,--gc-sections -o /tmp/npf_probe

      - name: Report sizes and run
        run: |
          echo "=== nanoprintf object ==="
          size /tmp/npf_impl.o
          echo
          echo "=== linked baseline ==="
          size /tmp/baseline
          echo
          echo "=== linked nanoprintf probe ==="
          size /tmp/npf_probe
          echo
          echo "=== section breakdown ==="
          size -A /tmp/npf_impl.o | sort -k2 -nr | head -20
          echo
          echo "=== functional probe ==="
          /tmp/npf_probe
