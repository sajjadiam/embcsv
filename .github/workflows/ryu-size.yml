name: ryu footprint

on:
  push:
    branches:
      - chatgpt-smoke-test
  workflow_dispatch:

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Ryu
        run: |
          git clone --depth 1 https://github.com/ulfjack/ryu.git /tmp/ryu

      - name: Build footprint probes
        run: |
          cat > /tmp/ryu_probe.c <<'EOF'
          #include "ryu/ryu.h"
          #include <stdint.h>

          volatile double input_value = 1.23456789;
          volatile uint32_t input_precision = 6U;
          volatile int sink_value;

          int main(void)
          {
              char buf[512];
              int n = 0;
              n += d2fixed_buffered_n(input_value, input_precision, buf);
              n += d2exp_buffered_n(input_value, input_precision, buf);
              sink_value = n;
              return n == 0;
          }
          EOF

          cat > /tmp/baseline.c <<'EOF'
          volatile int sink_value;
          int main(void)
          {
              sink_value = 1;
              return 0;
          }
          EOF

          gcc -std=c11 -Os -ffunction-sections -fdata-sections \
            -I/tmp/ryu -c /tmp/ryu/ryu/d2fixed.c -o /tmp/d2fixed.o

          gcc -std=c11 -Os -ffunction-sections -fdata-sections \
            -DRYU_ONLY_64_BIT_OPS \
            -I/tmp/ryu -c /tmp/ryu/ryu/d2fixed.c -o /tmp/d2fixed_64ops.o

          gcc -std=c11 -Os -ffunction-sections -fdata-sections \
            /tmp/baseline.c -Wl,--gc-sections -o /tmp/baseline

          gcc -std=c11 -Os -ffunction-sections -fdata-sections \
            -I/tmp/ryu \
            /tmp/ryu_probe.c /tmp/ryu/ryu/d2fixed.c \
            -Wl,--gc-sections -o /tmp/ryu_both

          gcc -std=c11 -Os -ffunction-sections -fdata-sections \
            -DRYU_ONLY_64_BIT_OPS \
            -I/tmp/ryu \
            /tmp/ryu_probe.c /tmp/ryu/ryu/d2fixed.c \
            -Wl,--gc-sections -o /tmp/ryu_both_64ops

      - name: Report sizes
        run: |
          echo "=== object: default ==="
          size /tmp/d2fixed.o
          echo
          echo "=== object: RYU_ONLY_64_BIT_OPS ==="
          size /tmp/d2fixed_64ops.o
          echo
          echo "=== linked baseline ==="
          size /tmp/baseline
          echo
          echo "=== linked fixed+scientific: default ==="
          size /tmp/ryu_both
          echo
          echo "=== linked fixed+scientific: RYU_ONLY_64_BIT_OPS ==="
          size /tmp/ryu_both_64ops
          echo
          echo "=== largest sections in default object ==="
          size -A /tmp/d2fixed.o | sort -k2 -nr | head -20
          echo
          echo "=== run probe ==="
          /tmp/ryu_both
